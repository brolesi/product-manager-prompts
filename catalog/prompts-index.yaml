- name: "epic-to-stories-formatter-jinja2"
  path: "vibes/epic-to-stories-formatter-jinja2.md"
  directory: vibes
  description: "A formatting agent prompt that renders structured epic/story data (JSON from an upstream generation agent or a prior session) through a fixed Jinja2 output template — the output-contract exemplar for jinja2-prompt-structures.md. The template guarantees every epic and story lands in identical canonical shape regardless of how many there are."
  usage: "The second half of a two-agent pipeline: an upstream prompt or agent produces epics/stories as structured data; this prompt renders them. The JSON schema is the real contract; this template is a projection of it. Use standalone by pasting any epic/story JSON, or wire it as the formatting stage in an agent workflow. Descends from an earlier User Story Formatting Agent experiment, with its three defects corrected (indexed metrics, split ID authority, guardless loops)."
  when_not: "- You have prose, not structured data: use the story-splitting prompts to produce the structure first. - You need to change the content, not the format: formatting agents format; they do not edit."
  date: "July 3, 2026"
  has_metadata: true
- name: "user-story-splitting-jinja2-loop"
  path: "vibes/user-story-splitting-jinja2-loop.md"
  directory: vibes
  description: "Splits an epic into user stories using a plan-then-iterate loop in Jinja2 notation: Phase A applies the Humanizing Work (Richard Lawrence) splitting rubric to derive and freeze the story list, a gate shows the plan for approval, and Phase B exhausts the frozen list one canonical story at a time. The flagship exemplar for jinja2-prompt-structures.md — all three structure roles in one prompt."
  usage: "The Jinja2-structured sibling of prompts/user-story-splitting-prompt-template.md: use the original for a quick one-shot split with options; use this one when the split should run as a controlled multi-turn loop — under /loop, inside an agent, or whenever runaway story generation is a risk. The AI is the renderer: no Jinja2 engine required; the notation is unambiguous instructions."
  when_not: "- You want three quick split options to compare: use the original template. - The epic is really a task list: just write the tasks."
  date: "July 3, 2026"
  has_metadata: true
