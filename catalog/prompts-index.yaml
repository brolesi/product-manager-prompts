  description: "Turns win/loss and churn debrief material — call transcripts, sales debrief notes, churned-customer interviews, CRM close notes — into structured ground truth: per-deal decision drivers, ranked win/loss patterns with evidence counts, competitor intelligence extracted for battle cards, and a confirm/refute ledger against what public-signal research inferred. If no debrief material is in session, it produces the interview guide instead, with the interviewing craft notes that keep answers honest. Win/loss is the only source that says why deals actually close; everything else is inference."
  usage: "The ground-truth half of the intelligence system: the HUMINT sweep (market-intelligence/humint-collection-prompt.md) frames win/loss questions from public signals; this prompt turns your team's completed interviews into findings that all-source fusion weights highest. Works from whatever you paste or attach: transcripts, notes, screenshots, CRM exports. Related: prompt-generators/discovery-interview-prompt-generator.md covers problem-discovery interviews; this one covers decisions already made — won, lost, or churned."
  when_not: "- No interviews done and none planned: run the HUMINT sweep for public people-signals instead; do not let synthesized vibes impersonate ground truth. - You want problem-discovery interviews: use the discovery interview generator; win/loss interviews autopsy a decision, not a problem space. - One angry churn email: that is an anecdote — log it and wait for a pattern, or interview properly."
  date: "July 17, 2026"
  has_metadata: true
