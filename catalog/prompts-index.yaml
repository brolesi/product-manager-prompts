  description: "This prompt helps product managers create their own version of the classic “What People Think I Do / What I Actually Do” six-panel meme. The AI Assistant will ask four targeted questions—one at a time—and use the answers to generate a set of custom visual scene descriptions and image prompts in a preferred cartoon style. Optionally, the user may upload a photo to model the character."
  usage: "If any of the following are missing from session context — [List of 5 stakeholder groups], [PM’s metaphor for their actual job], [Preferred visual style], [Hero image preference or selfie] — the AI must pause and ask the user: 1. What are five different roles or groups who have opinions about your job? 2. How do you experience your job as a product manager? Use a metaphor or cartoon-like visual. 3. What visual style should these images be in? (e.g., Pixar, Manga, Claymation, etc.) 4. Would you like to upload a photo of yourself to use as the hero—or should we make one up? Ask these questions one at a time. Do not proceed to the next question until the current one is answered."
  has_metadata: true
