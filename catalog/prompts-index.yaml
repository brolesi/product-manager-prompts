- name: "tam-sam-som-prompt-generator"
  path: "prompt-generators/tam-sam-som-prompt-generator.md"
  directory: prompt-generators
  description: "Facilitates the scoping decisions that determine what a market sizing number even means -- which problem space, which geography, which industry segments, which customers count as addressable -- then emits a reusable TAM/SAM/SOM prompt built on those answers, with the data sources appropriate to the chosen region named up front."
  usage: "Reach for this when the scope is the unsettled part. Two people sizing \"the market\" for the same product will produce numbers an order of magnitude apart if one counts every business in the country and the other counts businesses that have the problem badly enough to pay. The questions here are where that divergence gets settled, out loud, before any arithmetic happens. The emitted prompt is what you keep and re-run when you enter a new region or move upmarket."
  date: "July 30, 2026"
  has_metadata: true
- name: "user-story-prompt-generator-prompt"
  path: "prompt-generators/user-story-prompt-generator-prompt.md"
  directory: prompt-generators
  description: "Walks through the five decisions a user story rests on -- who has the job to be done, what job it is, what action triggers the system, what outcome counts as done, and which context the story is allowed to assume -- then emits a reusable user story prompt built on those answers. The assumption packages are the distinctive part: they make the story's unstated preconditions explicit and stackable instead of buried in a developer's head."
  usage: "Reach for this when the same argument keeps recurring in refinement -- stories that assume a logged-in user who may not be logged in, or an outcome nobody can test -- and you want a story prompt tuned to your product that teammates can run without you. Choosing the assumption package is the teaching moment; most story quality problems are assumption problems wearing a formatting complaint."
  date: "July 30, 2026"
  has_metadata: true
- name: "all-source-fusion-prompt"
  path: "market-intelligence/all-source-fusion-prompt.md"
  directory: market-intelligence
  description: "Fuses signals collected across independent intelligence disciplines (OSINT, FININT, GEOINT/DEMOINT, TECHINT, HUMINT, SIGINT, MASINT) into confidence-rated stories about a competitor's next move. Runs the confidence-stacking rule — one discipline is a watch item, two is a working hypothesis, three or more is actionable intelligence, conflict means someone is bluffing — and ends with recommended responses mapped to the PM artifacts each story should change."
  usage: "This is the situation room, not a collection prompt. It works best when the session already holds outputs from this directory's other investigations (snapshot, intel watch, pricing tracker, earnings refresh, VoC miner, PESTEL delta) — fusion then synthesizes instead of re-searching. You can also bulk-drop findings gathered elsewhere. Doctrine: reference/competitive-research-compendium.md, especially the All-Source Fusion discipline and the fusion cadence."
  when_not: "- You have signals from only one discipline: that is a watch item, not a fusion run. Collect more channels first. - You need fresh fieldwork: run the collection prompts in this directory, then fuse their outputs here. - You want a single framework read (SWOT, five forces): those prompts consume fused evidence; this one produces it."
  date: "July 16, 2026"
  has_metadata: true
- name: "ansoff-matrix-prompt"
  path: "market-intelligence/ansoff-matrix-prompt.md"
  directory: market-intelligence
  description: "Maps a company's growth options across the Ansoff Matrix with evidence per quadrant: market penetration, market development, product development, and diversification — each quadrant populated with researched candidate moves, the documented signals supporting them, risk ratings that respect the matrix's risk gradient, and a recommended sequence."
  usage: "Use when the growth question is on the table: where does the next tranche of growth come from, and at what risk? Works best with a landscape scan, five-forces read, or company research in session — the matrix then organizes evidence instead of brainstorming in a vacuum. This is a research prompt: candidate moves come from documented signals (adjacent segments actually underserved, competitor moves, expressed demand), not from wishful whiteboarding."
  when_not: "- Feature-level prioritization: this is portfolio altitude; use the feature-investment workshop for a single build decision. - No growth mandate or capacity: an options map without an owner is a poster."
  date: "July 3, 2026"
  has_metadata: true
- name: "battle-card-builder-prompt"
  path: "market-intelligence/battle-card-builder-prompt.md"
  directory: market-intelligence
  description: "Researches and drafts a competitive battle card autonomously: given your product and one competitor, the AI does the fieldwork — pricing pages, reviews, release notes, customer stories — and produces a field-action card with a source URL and Fact / Inference / Assumption label on every claim."
  usage: "Reach for this when you know which competitor matters and want the card built from public evidence rather than from what the room remembers -- especially for a competitor your team has strong opinions about but little current data on. If a competitive snapshot or watch report is already in session it will use that instead of re-researching. Governing criterion: material shift -- the card is a field-action artifact a rep opens mid-deal, not a research report."
  when_not: "- You hold rich internal win/loss knowledge the public web lacks: use the workshop and bring your evidence. - You need the whole competitor set compared: run the competitive research snapshot first, then build cards for the two that matter."
  date: "July 3, 2026"
  has_metadata: true
- name: "competitive-intel-watch-prompt"
  path: "market-intelligence/competitive-intel-watch-prompt.md"
  directory: market-intelligence
  description: "A scheduled competitive intelligence delta monitor. Given a previous Competitive Research Snapshot and a competitor list, sweeps for material shifts since the last run and reports only what changed: a cited changelog plus flags for which battle card or positioning sections now need updating. Designed to run unattended on a loop or schedule."
  usage: "Reach for this on a cadence -- weekly to quarterly -- once you are tired of finding out about a competitor's pricing change from a lost deal. Paste or attach the prior snapshot and it reports only what moved since. With no prior snapshot it produces the baseline itself, so the first run is never wasted. Governing criterion: material shift -- a change a sales rep or roadmap owner would act on."
  when_not: "- First run with no baseline: use the snapshot prompt (or let this prompt's fallback produce the baseline; the delta value starts on run two). - You need a full landscape re-think (new segment, pivot): re-run the snapshot from scratch instead of diffing a stale scope."
  date: "July 3, 2026"
  has_metadata: true
- name: "competitive-research-snapshot-prompt"
  path: "market-intelligence/competitive-research-snapshot-prompt.md"
  directory: market-intelligence
  description: "Researches a company's competitive landscape as a workflow, not a one-shot answer: search plan, competitor selection, just-enough research, Fact/Inference/Assumption labels, real URL citations, and next-step options. Produces a stable snapshot schema that downstream prompts (battle cards, delta monitors) can consume and diff."
  usage: "Reach for this when a product decision needs competitive grounding -- positioning, roadmap bets, deal support, board prep -- and you want evidence rather than the team's collective impression of the market. The output is a decision support snapshot, not a market report. Because it proceeds on labeled assumptions when questions go unanswered, it can run as an agent task or on a schedule; re-run it and diff against the prior snapshot."
  when_not: "- You need market sizing, not landscape: use market-intelligence/tam-sam-som-analysis-prompt.md. - You need deep intel on one company (executive signals, strategy): use prompts/company-profile-executive-insights-research.md. - The competitor set and facts are already gathered: go straight to the battle card or comparison artifact."
  date: "July 3, 2026"
  has_metadata: true
- name: "earnings-executive-signal-refresh-prompt"
  path: "market-intelligence/earnings-executive-signal-refresh-prompt.md"
  directory: market-intelligence
  description: "Quarterly refresh of a company's executive and strategy signals: parses the latest earnings call, filings, executive interviews, and announcements, then diffs against a prior executive profile — reporting what shifted in strategy, product direction, and leadership narrative."
  usage: "Reach for this each quarter, or after a major event, when one company matters enough to track closely -- an acquirer, a partner, your largest competitor, the account your roadmap depends on. Paste the prior profile and it reports the deltas; with no prior profile it runs baseline mode and establishes one, labeled as such. Works for public companies (earnings calls, filings) and, with reduced signal, for private ones (interviews, blogs, announcements)."
  when_not: "- No baseline profile exists: create one first (or this run becomes the baseline). - You need the full landscape, not one company: use the competitive watch or landscape scan."
  date: "July 3, 2026"
  has_metadata: true
- name: "finint-collection-prompt"
  path: "market-intelligence/finint-collection-prompt.md"
  directory: market-intelligence
  description: "Runs a FININT (Financial Intelligence) collection sweep on a target company: public filings, earnings-call language, procurement and government-spend records, entity registrations, competition and state-aid cases, and sovereign or state capital. Every signal lands in a fusion-ready inventory with a source URL, date, evidence label, and the inference chain it supports. The forensic accountant's discipline: companies lie in press releases; they lie less in filings, because lying there is a felony."
  usage: "One of seven discipline collection prompts feeding all-source-fusion-prompt.md; doctrine in reference/competitive-research-compendium.md (FININT discipline). For quarterly diffing of one company's executive language, hand off to earnings-executive-signal-refresh-prompt.md — this prompt owns the discipline-wide sweep: filings, money flows, procurement, and what the numbers say the strategy is. For EU and MENA procurement and registry sources, load reference/regional-source-overlays-eu-mena.md."
  when_not: "- You only need the quarterly exec-language diff: run the earnings refresh directly. - The target is private with a thin public record: collect what exists (incorporations, procurement, funding), label the gaps, and lean on the other disciplines. - You need market sizing math: the capture-rate output here feeds tam-sam-som-analysis; run that for the full recipe."
  date: "July 16, 2026"
  has_metadata: true
- name: "full-spectrum-company-sweep-prompt"
  path: "market-intelligence/full-spectrum-company-sweep-prompt.md"
  directory: market-intelligence
  description: "Everything about one company, in one run. Sweeps all seven collection disciplines back to back -- OSINT, FININT, TECHINT, HUMINT, GEOINT and DEMOINT, SIGINT, MASINT -- carries each discipline's signals forward into a single inventory, applies the confidence-stacking rule across them, and ends with a call-ready brief: a sixty-second verbal summary, the three things worth saying, the questions you will be asked with answers, and the claims you must not make. Built for the product manager who has to speak comprehensively about a company on short notice."
  usage: "Reach for this when a company suddenly matters and you have one sitting to get smart: a call scheduled for this afternoon, an exec who just asked what you know about an acquirer, a competitor that turned up in three lost deals this month, a partner about to see your roadmap. Give it a company name and what the conversation is for, pick a depth, and let it run. Rapid mode fits a coffee break; deep mode is a research afternoon. Every claim carries a source and a Fact / Inference / Assumption label, so you know which sentences you can say out loud and which ones you have to hedge."
  when_not: "- You need maximum rigor on one discipline -- forensic financials, a full technology teardown, a systematic people sweep. This runs each discipline at collection-floor depth to fit them all in one pass. - The subject is a market or category rather than a company: sizing, landscape, and forces analysis answer different questions. - You already hold recent discipline sweeps and only need them reconciled: that is a synthesis job, not a collection job. - The company is pre-public, pre-product, and pre-press: most disciplines will return nothing and the honest output is a short list of what cannot be known yet."
  date: "July 30, 2026"
  has_metadata: true
- name: "geoint-demoint-collection-prompt"
  path: "market-intelligence/geoint-demoint-collection-prompt.md"
  directory: market-intelligence
  description: "Runs a GEOINT/DEMOINT (Geospatial and Demographic Intelligence) collection sweep on a market: establishment counts by industry code, occupation and wage statistics, firmographic distributions, regional industry concentration, and trade flows — the government statistics most Product Managers never open. Every signal lands in a fusion-ready inventory with a source URL, date, evidence label, and the inference chain it supports. The cartographer's discipline: the terrain map, not troop movement — and the backbone of every ICP, Persona, and TAM that survives scrutiny."
  usage: "One of seven discipline collection prompts feeding all-source-fusion-prompt.md; doctrine in reference/competitive-research-compendium.md (GEOINT/DEMOINT discipline). This prompt reads the terrain; for the full sizing recipe (TAM x filters x capture rate) hand off to tam-sam-som-analysis-prompt.md, and for macro-factor deltas to pestel-delta-monitor-prompt.md. For EU and MENA statistical sources, load reference/regional-source-overlays-eu-mena.md."
  when_not: "- You need the finished market-size number: run tam-sam-som-analysis; this sweep produces its denominators and corridors. - You are watching macro shifts quarter over quarter: that is the PESTEL delta monitor's job. - The question is about one competitor, not the terrain: use the company-focused disciplines (OSINT, FININT, TECHINT)."
  date: "July 16, 2026"
  has_metadata: true
- name: "humint-collection-prompt"
  path: "market-intelligence/humint-collection-prompt.md"
  directory: market-intelligence
  description: "Runs a HUMINT (Human Intelligence) collection sweep on a target company: job-posting patterns, leadership moves, employee sentiment, alumni flows, and conference-circuit presence — plus a win/loss framing section, because interviews are the one source that says why deals actually close. Every signal lands in a fusion-ready inventory with a source URL, date, evidence label, and the inference chain it supports. The sports scout's discipline: organizations announce strategy through job boards long before press releases; people are the tell."
  usage: "One of seven discipline collection prompts feeding all-source-fusion-prompt.md; doctrine in reference/competitive-research-compendium.md (HUMINT discipline). Everything here is public-record people-watching: postings, announcements, review sites, published talks. The win/loss section frames questions for your own program — this prompt cannot conduct interviews, and says so rather than inventing quotes. Primary feed for roadmap bets (their build signals) and battle cards (org instability plays)."
  when_not: "- You want interview answers, not interview questions: win/loss calls are your team's fieldwork; synthesize completed debriefs with prompts/win-loss-analysis-prompt.md, and see the discovery interview assets in prompt-generators/ for problem discovery. - You need this week's site or pricing changes: that is SIGINT. - Anything requiring pretexting, soliciting NDA-protected information, or targeting individuals' private lives: out of scope and out of bounds — see the compendium's guardrails."
  date: "July 16, 2026"
  has_metadata: true
- name: "market-landscape-scan-prompt"
  path: "market-intelligence/market-landscape-scan-prompt.md"
  directory: market-intelligence
  description: "Autonomous market discovery: maps a segment's players (direct, adjacent, substitutes, emerging), how the market segments, where the money and momentum are, and where the whitespace is — with cited evidence and labeled inference. Produces the landscape view that feeds market sizing, positioning, and competitor selection."
  usage: "Use when entering or re-evaluating a market, scoping a new product line, or preparing strategy work that needs a defensible view of who plays where. Downstream: feeds market-intelligence/tam-sam-som-analysis-prompt.md (sizing), competitive-research-snapshot-prompt.md (deep-dive on selected players), and prompts/positioning-statement.md."
  when_not: "- You know the players and need depth on a few: use the competitive research snapshot. - You need a market size: this maps structure, not magnitude; use the TAM/SAM/SOM prompt (they pair well)."
  date: "July 3, 2026"
  has_metadata: true
- name: "masint-collection-prompt"
  path: "market-intelligence/masint-collection-prompt.md"
  directory: market-intelligence
  description: "Runs a MASINT (Measurement and Signature Intelligence) collection sweep on a target company: import/export records, facility and project signals (permits, land, utility approvals, EPC awards), operational capacity indicators (support response times, status- page incident patterns), and certification pipelines. Every signal lands in a fusion-ready inventory with a source URL, date, evidence label, and the inference chain it supports. The satellite photo discipline: measure the physical and operational exhaust — abnormal resource allocation never lies."
  usage: "One of seven discipline collection prompts feeding all-source-fusion-prompt.md; doctrine in reference/competitive-research-compendium.md (MASINT discipline). Strongest for hardware and industrial players; for pure software targets this sweep runs the software equivalent — ops capacity, status-page patterns, certification registries, and infrastructure-scale language in job postings. For MENA facility and project sources (industrial zones, environmental permits, utility approvals, EPC awards), load reference/regional-source-overlays-eu-mena.md. Primary feed for threat assessment and launch prediction."
  when_not: "- The target is a small pure-software company: expect a thin run; the ops-capacity section may be all there is — say so rather than padding. - You need financial corroboration for a volume anomaly: that disambiguation is FININT's job; flag the handoff. - You want people signals behind an ops strain: HUMINT owns hiring-freeze and sentiment reads."
  date: "July 16, 2026"
  has_metadata: true
- name: "osint-collection-prompt"
  path: "market-intelligence/osint-collection-prompt.md"
  directory: market-intelligence
  description: "Runs an OSINT (Open Source Intelligence) collection sweep on a target company: press and newsroom output, analyst coverage, exec social posts, review-site clusters, conference footprint, webinar cadence, and prediction-market odds. Every signal lands in a fusion-ready inventory with a source URL, date, evidence label, and the inference chain it supports. The journalist's-desk discipline: what a good beat reporter knows before the press release drops."
  usage: "One of seven discipline collection prompts feeding all-source-fusion-prompt.md; doctrine in reference/competitive-research-compendium.md (OSINT discipline). For deep review mining hand off to voice-of-customer-miner-prompt.md; for whole-market mapping use market-landscape-scan-prompt.md. This prompt owns the discipline-wide sweep: what is [TARGET] saying, being said about, and signaling in public right now."
  when_not: "- You need the full competitor set mapped: run the landscape scan or competitive snapshot first. - You need review-level depth on customer pain: that is the VoC miner's job; this sweep only flags the clusters. - You already ran this recently: run competitive-intel-watch to diff instead of re-collecting."
  date: "July 16, 2026"
  has_metadata: true
- name: "pestel-delta-monitor-prompt"
  path: "market-intelligence/pestel-delta-monitor-prompt.md"
  directory: market-intelligence
  description: "Quarterly PESTEL refresh: re-scans the political, economic, social, technological, environmental, and legal factors from a prior PESTEL analysis and reports which factors materially moved, which assumptions broke, and what new factors entered the frame — with cited evidence."
  usage: "Run prompts/pestel-analysis-prompt-template.md once to create the baseline, then run this on a cadence (quarterly is typical) with the prior analysis in session. Macro factors move slowly; the value is catching the two that moved, not re-debating the twenty that did not."
  when_not: "- No baseline PESTEL exists: run the template first. - The business context changed fundamentally (new market, pivot): redo the full analysis; do not diff across a scope change."
  date: "July 3, 2026"
  has_metadata: true
- name: "porters-five-forces-prompt"
  path: "market-intelligence/porters-five-forces-prompt.md"
  directory: market-intelligence
  description: "Reads an industry's structure through Porter's Five Forces with cited evidence: rivalry, threat of new entrants, threat of substitutes, buyer power, and supplier power — each force rated with the documented signals that justify the rating, plus the profit-pool implication most five-forces decks skip."
  usage: "Use before entering a market, when margins are eroding and nobody can say why, or to pressure-test a strategy that assumes the industry is kinder than it is. Pairs upstream with market-landscape-scan-prompt.md (who plays) — this asks what the structure does to everyone who plays. Include AI-driven substitution explicitly; in 2026 it is the substitute threat in most knowledge industries."
  when_not: "- You need one company's position: use swot-analysis-prompt.md; five forces reads the industry, not a player. - Nascent categories with no stable structure: the forces are still forming; run the landscape scan and revisit."
  date: "July 3, 2026"
  has_metadata: true
- name: "pricing-packaging-tracker-prompt"
  path: "market-intelligence/pricing-packaging-tracker-prompt.md"
  directory: market-intelligence
  description: "Tracks competitor pricing and packaging over time: captures current public pricing pages into a stable schema, diffs against the prior capture, and reports tier changes, price moves, feature-gate shifts, and packaging restructures — with screenshots-in-words and URLs."
  usage: "Run once to create the pricing baseline for a competitor set, then on a cadence (monthly or quarterly). Public pricing only; where pricing is \"contact sales,\" track what IS public (editions, gates, published floors) and label the rest. Feeds the competitive watch, battle cards, and pricing decisions."
  when_not: "- You need pricing strategy advice: this tracks the market; it does not recommend your price. - Pricing is fully opaque across the set: expect thin results; win/loss and VoC mining may reveal more."
  date: "July 3, 2026"
  has_metadata: true
- name: "sigint-collection-prompt"
  path: "market-intelligence/sigint-collection-prompt.md"
  directory: market-intelligence
  description: "Runs a SIGINT (Signals Intelligence) collection sweep on a target company: website and pricing-page diffs, SEO/SEM moves, app-store metadata shifts, new SSL certificates and subdomains, case-study patterns, and webinar/event cadence. Every signal lands in a fusion-ready inventory with a source URL, date, evidence label, and the inference chain it supports. The wiretap you are allowed to have: companies broadcast constantly through what they change on the public internet; most competitors never listen."
  usage: "One of seven discipline collection prompts feeding all-source-fusion-prompt.md; doctrine in reference/competitive-research-compendium.md (SIGINT discipline). The freshest discipline on the collection floor — this is what keeps battle cards from going stale, on a weekly cadence. For scheduled diffing against a baseline hand off to competitive-intel-watch-prompt.md; for the pricing time series, pricing-packaging-tracker-prompt.md. This prompt owns the discipline-wide sweep across all the broadcast channels at once."
  when_not: "- You want the governed weekly routine: run loops/fusion-cadence-routine.md or competitive-watch-routine.md; this is the manual sweep they schedule. - You only need pricing history: the pricing-packaging tracker already owns that series. - You need what has not shipped yet: TECHINT reads the 12-18 month fingerprints; SIGINT reads the launch staging."
  date: "July 16, 2026"
  has_metadata: true
- name: "swot-analysis-prompt"
  path: "market-intelligence/swot-analysis-prompt.md"
  directory: market-intelligence
  description: "Builds an evidence-cited SWOT analysis of a company — yours or a competitor's — from public sources: strengths and weaknesses from documented capability and customer voice, opportunities and threats from market and macro signals. Every entry carries a source URL and a Fact / Inference / Assumption label, plus the \"so what\" that most SWOTs skip."
  usage: "Use for strategy reviews, board prep, partnership evaluation, or as the competitor-depth companion to the competitive research snapshot. Works best when session already holds a snapshot, VoC themes, or a landscape scan — the SWOT then synthesizes instead of re-searching. Related: porters-five-forces-prompt.md reads the industry's structure; this reads one company's position within it."
  when_not: "- Internal-only SWOT from private knowledge: run it as a workshop with your team's evidence; this prompt works the public record. - You need the whole competitor set: snapshot first, SWOT the one or two that matter."
  date: "July 3, 2026"
  has_metadata: true
- name: "tam-sam-som-analysis-prompt"
  path: "market-intelligence/tam-sam-som-analysis-prompt.md"
  directory: market-intelligence
  description: "Runs a fully autonomous, citation-backed TAM/SAM/SOM analysis. The AI does the heavy lifting with real-world data and clickable sources, defaulting to strong evidence-based assumptions rather than waiting on the user. Demonstrates the autonomous investigation interaction mode (see interaction-modes.md)."
  usage: "Fill in the bracketed context block before running. This is the autonomous sibling of prompt-generators/tam-sam-som-prompt-generator.md: use the generator when you want to be facilitated through scoping decisions; use this prompt when you know the scope and want a defensible model built for you. Because it proceeds without further input, it is suitable for agent, loop, or scheduled runs."
  when_not: "- You have not yet decided product, buyer, or geography: use the facilitated generator to scope first. - You need internal-data sizing (pipeline, usage telemetry): this prompt is built on public evidence. - You need a market landscape (players, segments, dynamics) rather than a size: that is a different investigation."
  date: "July 3, 2026"
  has_metadata: true
- name: "techint-collection-prompt"
  path: "market-intelligence/techint-collection-prompt.md"
  directory: market-intelligence
  description: "Runs a TECHINT (Technical Intelligence) collection sweep on a target company: patent and trademark filings, technographics, public changelogs and API-doc diffs, repo activity, standards-body participation, funded research, and academic preprints. Every signal lands in a fusion-ready inventory with a source URL, date, evidence label, and the inference chain it supports. The patent examiner's discipline: R&D leaves fingerprints 12-18 months before products ship."
  usage: "One of seven discipline collection prompts feeding all-source-fusion-prompt.md; doctrine in reference/competitive-research-compendium.md (TECHINT discipline). The longest-range discipline on the collection floor: research and standards signals lead product by 12-48 months, patents by 12-18, trademarks by 6-12, API-doc diffs by weeks. Primary feed for roadmap bets — where to accelerate versus concede. For EU research and standards sources (CORDIS, Espacenet, CEN/CENELEC/ETSI), load reference/regional-source-overlays-eu-mena.md."
  when_not: "- You need legal patent analysis (validity, infringement, freedom to operate): that is counsel's work; this reads direction, not legal exposure. - The target ships no technology (pure services): TECHINT will run dry; lean on FININT and HUMINT. - You need this week's shipped changes: SIGINT's web diffs are the fresher layer; TECHINT reads what has not shipped yet."
  date: "July 16, 2026"
  has_metadata: true
- name: "voice-of-customer-miner-prompt"
  path: "market-intelligence/voice-of-customer-miner-prompt.md"
  directory: market-intelligence
  description: "Mines public customer voice — review sites, app stores, forums, communities — for unmet needs, competitor weaknesses, and switching triggers, with quoted evidence and labeled inference. Bridges competitive intelligence and discovery: outputs feed JTBD canvases, opportunity solution trees, and battle cards."
  usage: "Use when you want evidence of what users actually complain about and wish for — yours and competitors' — without waiting on an interview cycle. Strongest for products with public review footprints (B2B SaaS on G2/Capterra, consumer apps on app stores, dev tools on forums). Public voice skews toward the angry and the vocal; treat themes as hypotheses to validate, not verdicts."
  when_not: "- No meaningful public footprint (early-stage, niche enterprise): run discovery interviews instead. - You need YOUR users' voice on a private product area: mine your own support tickets and research, not the public web. - Statistical confidence is required: this is qualitative theming."
  date: "July 3, 2026"
  has_metadata: true
- name: "battle-card-workshop"
  path: "workshops/battle-card-workshop.md"
  directory: workshops
  description: "A Generative Guidance prompt that helps any product manager, product marketer, or sales enablement professional build a competitive battle card. Guides the user through 3–5 questions to shape the card before generating it."
  usage: "Reach for this when the people who know the competitor are in the room and the card should capture what they know: which objections actually come up, which losses still sting, which competitor claim your reps have no good answer for. The facilitation pulls that out of human memory rather than public sources, which is where the useful half of any battle card lives."
  date: "May 2026"
  has_metadata: true
- name: "feature-investment-workshop"
  path: "workshops/feature-investment-workshop.md"
  directory: workshops
  description: "A Generative Guidance (v2) prompt that facilitates a build / don't-build business case for a feature: revenue connection (direct or indirect), cost structure, ROI math, and strategic value, ending in a recommendation with supporting numbers."
  usage: "Use for features big enough to argue about (more than an engineer-month), build/buy/partner decisions, or defending a prioritization call to leadership. This is the financial lens; it complements, not replaces, discovery and prioritization frameworks."
  when_not: "- Table-stakes features needed for competitive parity: the market already made the decision. - Work under a week of effort: just build it. - The problem is unvalidated: do discovery first; ROI math on an imaginary problem is fiction with a spreadsheet. - Purely qualitative value (brand, delight) with no measurable retention effect: make that case honestly as strategy, not ROI."
  date: "July 3, 2026"
  has_metadata: true
- name: "lean-ux-canvas-workshop"
  path: "workshops/lean-ux-canvas-workshop.md"
  directory: workshops
  description: "A Generative Guidance (v2) prompt that facilitates Jeff Gothelf's Lean UX Canvas (v2): guided decisions about the business problem, focus persona, outcome altitude, and experiment appetite, then the filled canvas with hypotheses and a least-work-to-learn experiment."
  usage: "Reach for this when an initiative arrives as a solution (\"build X\") and needs reframing around the business problem, or when a team has too many assumptions and no agreed place to start learning. The guided version earns its time when the canvas will be filled with other people watching -- deciding the outcome altitude and the experiment appetite out loud is what stops the canvas becoming a wish list with boxes."
  when_not: "- Problem and riskiest assumption already validated: design the experiment directly. - The user need is unexplored: run painstorming or JTBD first; the canvas assumes you can name a persona and benefit."
  date: "July 3, 2026"
  has_metadata: true
- name: "opportunity-solution-tree-workshop"
  path: "workshops/opportunity-solution-tree-workshop.md"
  directory: workshops
  description: "A Generative Guidance (v2) prompt that facilitates an Opportunity Solution Tree (Teresa Torres): extract the target outcome from a stakeholder request, branch into opportunities (customer problems), map candidate solutions, and select the best first experiment."
  usage: "Use when a stakeholder request or vague OKR needs problem framing before anyone decides what to build. The tree bridges discovery and prioritization: outputs feed a prioritization framework or an experiment plan. Pairs upstream with jobs-to-be-done.md and discovery-interview-guide-prompt-template.md."
  when_not: "- The problem is already validated: go straight to solution testing. - Tactical bug fixes or technical debt: no discovery needed. - A stakeholder is demanding one specific solution: fix the alignment problem first; a tree will not outrank a mandate."
  date: "July 3, 2026"
  has_metadata: true
- name: "painstorming-workshop"
  path: "workshops/painstorming-workshop.md"
  directory: workshops
  description: "A Generative Guidance (v2) prompt that facilitates a PAINstorming table (MITRE ITK): Persona, Activities, Insights, Needs. Builds a structured, evidence-honest user-understanding artifact that feeds JTBD framing, proto-personas, and discovery interview planning."
  usage: "Use in early discovery when the team needs structured user understanding before committing to a problem statement or solution, or when stakeholders hold conflicting models of who the user is. Pairs naturally with prompts/jobs-to-be-done.md (downstream) and prompts/proto-persona-profile.md (either direction)."
  when_not: "- You already have validated research: synthesize it into JTBD or personas directly instead of restorming. - You need a full persona artifact: PAINstorming feeds personas; it is not one. - Nobody intends to talk to users afterward: an assumption-only table that never gets validated ossifies into fiction."
  date: "July 3, 2026"
  has_metadata: true
- name: "prd-workshop"
  path: "workshops/prd-workshop.md"
  directory: workshops
  description: "Builds a complete PRD one section at a time, driven by whatever PRD template the user's team already uses. The template's own sections become the working structure; the human gates each section before the next begins. Demonstrates the checkpointed co-construction interaction mode (see interaction-modes.md)."
  usage: "Reach for this when the PRD is high-stakes enough to steer as it is written -- a funding decision, a contentious scope, a document several people will redline -- and you would rather approve each section than react to a finished draft. Bring your team's template (PDF, Markdown, Word, screenshot, or rough outline): the point is to fill YOUR structure, not impose a generic one. Supporting context helps but is not required; the gates will surface what is missing section by section."
  when_not: "- You need requirements reverse-engineered from a formal spec: use reverse-engineer-IEEE830srs-to-PRD-prompt-template.md or reverse-engineer-ISO29148-to-PRD-prompt-template.md instead. - You will not be present to review sections: this mode depends on a human gate at every checkpoint."
  date: "July 3, 2026"
  has_metadata: true
- name: "problem-framing-canvas-workshop"
  path: "workshops/problem-framing-canvas-workshop.md"
  directory: workshops
  description: "A Generative Guidance (v2) prompt that facilitates the MITRE Problem Framing Canvas: explore the problem area, affected populations, current state, and desired outcome, then converge on an evidence-grounded problem statement and an actionable \"How might we...\" question."
  usage: "Reach for this at initiative kickoff when the problem space is ambiguous, when a vague executive mandate needs reframing before it hits the roadmap, or as a periodic checkpoint that in-flight work still maps to the original problem. MITRE's guidance applies: if the team is already aligned this takes 30 seconds; if it takes longer, that time was worth spending. The exploration of affected populations and current state is the part that changes minds -- it is why this runs as a facilitated canvas rather than a single drafted statement."
  when_not: "- The problem is validated and framed: go to solution work; a re-framing ritual on a settled problem is theater. - You need user-level pain detail: run painstorming-prompt- generator.md first and feed its output here."
  date: "July 3, 2026"
  has_metadata: true
- name: "product-sunset-workshop"
  path: "workshops/product-sunset-workshop.md"
  directory: workshops
  description: "Builds a complete product or feature sunsetting (End-of-Life) plan section by section, allowing the human to review and gate each section before the next begins. Integrates with existing communication templates and teaches trust-preserving sunset strategies. Demonstrates the checkpointed co-construction interaction mode."
  usage: "Works best when the product/feature target, customer impact metrics, transition alternatives, and sunset rationale are in session. Compiles a detailed EOL plan and integrates with prompts/eol-for-a-product-message.md."
  date: "July 7, 2026"
  has_metadata: true
- name: "competitive-watch-routine"
  path: "loops/competitive-watch-routine.md"
  directory: loops
  description: "Run a competitive intelligence watch as a governed /routine: diff against the last approved snapshot, report only material shifts in an embedded changelog format (URL, date, Fact / Inference / Assumption label per claim), close every run with a receipt (name, version, sources, competitor list), and control drift with version bumps — because a routine's failure mode is mutation in captivity."
  usage: "The scheduled, versioned form of market-intelligence/competitive-intel-watch-prompt.md — run that once for the baseline, then run this on cadence with the prior snapshot in session. The shift-report and receipt formats below are the contract; when run twelve behaves differently from run three, the receipts tell you whether the market moved or the routine did."
  when_not: "- First run / no baseline: use the snapshot prompt to create one. - One-off competitive question: that is a prompt, not a routine; ask it directly with citation instructions."
  date: "July 3, 2026"
  has_metadata: true
- name: "epic-story-batch"
  path: "loops/epic-story-batch.md"
  directory: loops
  description: "Convert a backlog of epics into review-ready story sets under a governed /batch: item cap, one epic at a time in dependency order, the canonical story format embedded, a per-epic receipt, and fail-stop — so one weak instruction damages one epic instead of marching through the folder with the confidence of a Seagull Manager who just discovered automation."
  usage: "Bring the epic list in whatever shape you have it and the base-camp context. Reach for this when the backlog is too big to work by hand and you are nervous about turning an AI loose on all of it at once -- which is the correct instinct. The batch failure mode is scale without visibility; every control here keeps the blast radius at one item, and every epic leaves a receipt you can audit afterward."
  when_not: "- One epic: that is a loop, not a batch — use loops/story-splitting-loop.md. - Epics not yet validated as hypotheses: batching multiplies an upstream mistake by the size of the folder."
  date: "July 3, 2026"
  has_metadata: true
- name: "fusion-cadence-routine"
  path: "loops/fusion-cadence-routine.md"
  directory: loops
  description: "Run the intelligence collection floor as a governed /routine on the compendium's fusion cadence: weekly SIGINT sweep, monthly OSINT + HUMINT digest, quarterly FININT + TECHINT deep pass, annual GEOINT/DEMOINT terrain refresh, event-driven MASINT alerts — each tier feeding the same fusion-ready signal inventory, with a quarterly all-source fusion brief on top and receipts controlling drift. The parent rhythm of the market-intelligence directory."
  usage: "Orchestrates the seven collection prompts in market-intelligence/ (osint-, finint-, geoint-demoint-, techint-, humint-, sigint-, masint-collection) and closes each quarter with all-source-fusion-prompt.md. Doctrine: the Fusion Cadence section of market-intelligence/reference/competitive-research-compendium.md. Run each collection prompt once manually for its baseline before scheduling its tier — a routine that has never seen a baseline regenerates instead of diffing. competitive-watch-routine.md is the narrower sibling: same governance, one discipline's aperture."
  when_not: "- No baselines exist yet: run the collection prompts directly first; this routine diffs, it does not found. - You only care about one channel (pricing, reviews): schedule the matching single prompt; the full cadence would bill you for quiet disciplines. - One-off deep dive before a decision: run the collection prompts and fusion directly, no routine wrapper needed."
  date: "July 16, 2026"
  has_metadata: true
- name: "market-sizing-loop"
  path: "loops/market-sizing-loop.md"
  directory: loops
  description: "Build a TAM/SAM/SOM model segment by segment under a seasoned /goal + /loop: index the segments first (Rule 3), size one segment per turn bottom-up with its own cited inputs, gate each on modify-or-continue, and only then roll up — so one bad assumption stays in its segment instead of silently propagating through the whole model. The segment sizing format is embedded at every level."
  usage: "Bring the scope (product, geography, buyer) or accept labeled defaults. Each segment follows the evidence contract of market-intelligence/tam-sam-som-analysis-prompt.md (bottom-up, URL per data point, ranges for uncertainty); this recipe adds the loop controls around it. Feeds from market-landscape-scan-prompt.md when its segment map is in session."
  when_not: "- One homogeneous segment: run the TAM/SAM/SOM prompt directly; there is nothing to loop over. - Sizing to justify a decision already made: no loop fixes that."
  date: "July 3, 2026"
  has_metadata: true
- name: "prd-section-loop"
  path: "loops/prd-section-loop.md"
  directory: loops
  description: "Draft a PRD one section at a time under a seasoned /goal + /loop: the canonical sections are spelled out as a visible data structure (name, what it must cover, what it depends on), drafted in dependency order with cheap checks before expensive critique, a modify-or-continue gate per section, and compaction of each approved section into the minimum context later sections need."
  usage: "Reach for this when you want the PRD built section by section under loop control rather than in conversation -- long documents, repeated runs, or work you want to hand to an agent and audit later. Bring your team's PRD template if you have one; its sections replace the canonical set below. Bring whatever discovery material exists. Level 0 works today as typed; Level 1 is the full multi-turn contract; Level 2 is the routine form with the section structure as data."
  when_not: "- The problem statement is still under negotiation: critical path — do not loop on section seven while section three is wobbling. - Quick internal one-pager: the ceremony outweighs the document."
  date: "July 3, 2026"
  has_metadata: true
- name: "research-synthesis-loop"
  path: "loops/research-synthesis-loop.md"
  directory: loops
  description: "Synthesize research (interviews, VoC, support signals) one category per turn under a seasoned /goal + /loop: the category index is built once, each pass pulls forward only that category's evidence, and every theme is rendered in an embedded output format with real verbatims, frequency, and Fact / Inference / Assumption labels — so eight transcripts don't get boiled into one vat of vaguely strategic soup."
  usage: "Bring the raw material -- transcripts, review exports, support tickets, sales notes -- into session. Reach for this when you have more research than you can hold in your head at once and the honest risk is that everything gets flattened into three comfortable themes that confirm what you already believed. The theme output format below is the contract at every level; the loop just controls how many themes and when you gate."
  when_not: "- One interview: just summarize it; the ceremony outweighs the material. - No raw material in session: gather first — synthesis of nothing is opinion with headers."
  date: "July 3, 2026"
  has_metadata: true
- name: "story-splitting-loop"
  path: "loops/story-splitting-loop.md"
  directory: loops
  description: "Split an epic into right-sized user stories with a /goal plus two /loop commands, seasoned with the four rules (calculate once, order checks by cost, index before search, critical path) and finished with Just Enough Jinja2. The canonical user story output format is embedded at every level — the markdown is the meal; the Jinja2 only marks where the work repeats, stops, and signs its output."
  usage: "Bring an epic and the stable context: persona, outcome, constraints, decisions already made. Reach for this when splitting is iterative work rather than a single pass -- the first split produces stories that are still too big, and you want the loop to keep going until each one is right-sized without re-typing the rules each turn. Level 0 works today as typed; Level 1 adds the operating contract; Level 2 is the routine form. All three render the same canonical story format."
  when_not: "- One small story to split once: use the one-shot template. - The epic is unvalidated fog: frame the problem first; forty consistent stories from a bad epic is downstream polish on upstream fog."
  date: "July 3, 2026"
  has_metadata: true
- name: "swot-batch"
  path: "loops/swot-batch.md"
  directory: loops
  description: "Run an evidence-cited SWOT across a competitor set as a governed /batch: one company at a time, the quadrant output format embedded, a per-company receipt, an item cap, and fail-stop — then, and only then, the cross-company comparison. Batching SWOTs is where \"scale without visibility\" bites hardest: five confident, unsourced SWOTs look exactly like five evidenced ones until a rep quotes the wrong weakness in a deal."
  usage: "Bring the competitor list (ideally from market-intelligence/competitive-research-snapshot-prompt.md or market-landscape-scan-prompt.md — reuse that evidence instead of re-searching). Each company's SWOT follows market-intelligence/swot-analysis-prompt.md's rules; this recipe adds the batch controls around it."
  when_not: "- One company: run the SWOT prompt directly; a batch of one is a loop wearing a hat. - No evidence base and no search access: a batch multiplies fabrication risk by the size of the list."
  date: "July 3, 2026"
  has_metadata: true
