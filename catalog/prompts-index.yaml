- name: "premortem-prompt-generator"
  path: "prompt-generators/premortem-prompt-generator.md"
  directory: prompt-generators
  description: "A Generative Guidance (v2) prompt that facilitates a premortem: guided decisions about the initiative, failure horizon, candor level, and audience, then a generated premortem prompt that imagines the failure and works backward to ranked risks and owned mitigations."
  usage: "Reach for this when the premortem's setup is itself delicate: how far out to imagine the failure, how blunt the room is allowed to be, and who will read the output — which is usually what determines whether anyone says the real risk. Deciding those before the exercise is the work; the emitted prompt is what you run with the team and reuse at the next gate."
  when_not: "- The failure already happened: run a retrospective. - No concrete plan exists yet: a premortem needs something to kill; frame the problem and plan first. - You need a quantitative risk register for compliance: this is a divergent-thinking exercise, not probabilistic risk sizing."
  date: "July 3, 2026"
  has_metadata: true
- name: "prioritization-framework-prompt-generator"
  path: "prompt-generators/prioritization-framework-prompt-generator.md"
  directory: prompt-generators
  description: "A Generative Guidance (v2) prompt that helps a product team choose the right prioritization framework (RICE, ICE, value/effort, Kano, weighted scoring, cost of delay, MoSCoW, and others) for their stage and context, then generates a reusable scoring prompt for the chosen framework."
  usage: "Use when choosing a prioritization approach for the first time, when the current one is not working (\"framework whiplash\"), or when stakeholders keep relitigating how work gets ranked. The output is a recommendation with rationale plus a working prompt, not a ranking of your backlog."
  when_not: "- You already have a working framework: do not fix what is not broken; ask the AI to score your items with it instead. - The decision is a one-off strategic bet: frameworks are for recurring prioritization, not single big decisions. - The real problem is missing strategy: no framework can tell you what to build; frameworks execute strategy."
  date: "July 3, 2026"
  has_metadata: true
- name: "proto-persona-prompt-generator"
  path: "prompt-generators/proto-persona-prompt-generator.md"
  directory: prompt-generators
  description: "Facilitates the decisions behind a proto-persona -- which slice of the market this person represents, what they are hired to accomplish, which beliefs about them are evidence and which are guesses -- one question at a time with three context-aware options each, then emits a reusable proto-persona prompt built on those answers."
  usage: "Reach for this when the team is arguing about who the user is, or when several personas are quietly collapsing into one composite that describes nobody. Separating what you know from what you are assuming is the work; the emitted prompt is what you re-run after research turns some of those assumptions into facts."
  date: "March 2, 2026"
  has_metadata: true
- name: "research-agent-prompt-generator"
  path: "prompt-generators/research-agent-prompt-generator.md"
  directory: prompt-generators
  description: "A Generative Guidance (v2) prompt that builds autonomous investigation prompts: facilitates decisions about the watch target, cadence, materiality bar, evidence standard, and downstream consumer, then emits a schedule-ready research prompt conforming to the investigation mode contract (see interaction-modes.md and market-intelligence/README.md)."
  usage: "The meta-move for the investigations category: instead of waiting for the library to cover your research need, this generator teaches you to construct the prompt — question budget, search plan gate, Fact/Inference/Assumption labels, do-not-invent list, stable schema, delta rule. Emitted prompts are suitable for /loop, /goal, scheduled agents, or manual re-runs. Existing investigations (competitive-intel-watch, pricing-packaging-tracker, pestel-delta) are worked examples of what this generator produces."
  when_not: "- An existing investigation prompt already covers the need: use it. - The research target is private data (your tickets, your metrics): investigation prompts assume the public web. - One-off question, no re-run intended: just ask the AI directly with citation instructions."
  date: "July 3, 2026"
  has_metadata: true
- name: "stakeholder-map-prompt-generator"
  path: "prompt-generators/stakeholder-map-prompt-generator.md"
  directory: prompt-generators
  description: "A Generative Guidance (v2) prompt that facilitates a stakeholder map for a product initiative: guided decisions about scope, lens, and depth, then a generated stakeholder-mapping prompt with a Power x Interest grid and per-stakeholder engagement plan."
  usage: "Reach for this at initiative kickoff, when alignment keeps stalling without an obvious blocker, or before a big communication push -- particularly when you suspect the map you would draw from memory is missing someone. Works from thin context on purpose: choosing the scope, the lens, and how deep to go is the work, and the emitted prompt is what you re-run when the org chart moves."
  when_not: "- You need decision rights (who approves, who is consulted): use daci-chart-prompt-generator.md instead. - You already have the stakeholder list and stances: run the companion template directly."
  date: "July 3, 2026"
